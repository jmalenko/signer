[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests
    feature: Feature tests
    slow: Slow tests
    gui: Tests requiring GUI
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# LibreOffice integration for Word/ODT format tests
# Use: pytest --libreoffice-path <path_to_soffice>
# Example: pytest --libreoffice-path "C:\Program Files\LibreOffice\program\soffice.exe"
# or for portable: pytest --libreoffice-path "C:\PortableApps\LibreOfficePortable\App\libreoffice\program\soffice.exe"