name: Build executables

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_FONTDIR: ${{ matrix.platform == 'windows' && 'C:/Windows/Fonts' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            executable: signer.exe
            release_name: signer-windows.exe
          - platform: macos
            runner: macos-latest
            executable: signer
            release_name: signer-macos
          - platform: linux
            runner: ubuntu-22.04
            executable: signer
            release_name: signer-linux

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Linux Qt runtime dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check offscreen fonts
        run: >-
          python -c "from PySide6.QtCore import qVersion;
          from PySide6.QtGui import QFont, QFontDatabase, QFontMetricsF;
          from PySide6.QtWidgets import QApplication;
          app = QApplication([]);
          families = QFontDatabase.families();
          bounds = QFontMetricsF(QFont()).boundingRect('Signer');
          print('Qt:', qVersion(), 'Platform:', app.platformName(),
          'Font families:', len(families), 'Text bounds:', bounds);
          assert families, 'Offscreen Qt could not discover any fonts';
          assert 0 < bounds.width() < 10000, 'Offscreen Qt font metrics are invalid'"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run platform-stable tests
        run: >-
          python -m pytest tests/unit
          --ignore=tests/unit/test_toolbar_onscreen.py
          --ignore=tests/unit/test_window_sizing.py
          --capture=no --no-qt-log
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run native toolbar tests
        if: matrix.platform != 'linux'
        run: python -m pytest tests/unit/test_toolbar_onscreen.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm signer.spec

      - name: Name release executable
        run: >-
          python -c "from pathlib import Path;
          source = Path('dist') / '${{ matrix.executable }}';
          source.rename(Path('dist') / '${{ matrix.release_name }}')"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: signer-${{ matrix.platform }}
          path: dist/${{ matrix.release_name }}
          if-no-files-found: error

  release:
    name: Publish release artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: release_version
        run: echo "version=$(python signer/release_version.py)" >> "$GITHUB_OUTPUT"

      - name: Download executable artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
